[project]
name = "ai-debate"
version = "1.0.0"
description = "AI Agent Debate System — Assignment 5, Orchestration for AI Agents course"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "duckduckgo-search>=6.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
dev-dependencies = [
    "pillow>=12.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",
    "*/tests/*",
    "*/__init__.py",
    "src/debate/cli/menu.py",
    "src/debate/orchestrator/agent_workers.py",
    "src/debate/shared/version.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
